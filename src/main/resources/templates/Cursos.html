<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
    <div th:replace="~{fragmentos :: menu}"></div>

    <h1>Cursos</h1>

   
    <section class="resumen">
        <div class="dato">
            <span class="numero" th:text="${cursos != null} ? ${#lists.size(cursos)} : 0">0</span>
            <span class="etiqueta">Cursos</span>
        </div>
    </section>


    <section class="cursos-grid">
        <article class="tarjeta-curso"
                 th:each="curso : ${cursos}"
                 th:with="total=${#lists.size(curso.matriculas)}">

            <header>
                <h2 class="curso-nombre" th:text="${curso.nombreCurso}">Nombre del curso</h2>
                <span class="area" th:text="${curso.especialidad}">Área</span>
            </header>

            <div class="docente">
                <span class="docente-etiqueta">Docente:</span>
                <span class="docente-nombre" th:if="${curso.docente != null}"
                      th:text="${curso.docente.nombre}">Nombre</span>
                <span class="sin-asignar" th:unless="${curso.docente != null}">Sin asignar</span>
            </div>

            <div class="cupos">
                <span class="cupos-etiqueta">Matriculados:</span>
                <strong class="cupos-numero" th:text="${total} + ' / 30'">0 / 30</strong>
                <small class="cupos-libres" th:if="${total < 30}"
                       th:text="${30 - total} + ' cupos disponibles'"></small>
                <small class="completo" th:if="${total >= 30}">Curso completo</small>
            </div>

            <details class="alumnos" th:if="${total > 0}">
                <summary>Ver alumnos</summary>
                <ul>
                    <li th:each="m : ${curso.matriculas}" th:text="${m.alumno.nombre}"></li>
                </ul>
            </details>
        </article>
    </section>

    <p class="vacio" th:if="${cursos == null or #lists.isEmpty(cursos)}">No hay cursos registrados</p>
</body>
</html>
