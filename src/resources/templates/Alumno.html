<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/resources/static/styles.css">
        <script src="/src/resources/static/script.js" defer></script>
    <title>Alumno</title>
</head>
<body>
    <h1>Alumnos</h1>

    <h2>Listado de alumnos</h2>
    

          
 <section class="buscar-alumno">
   
        <div class="formulario">
            <label>Buscar
                <input id="buscar" type="search" placeholder="ID o nombre" autocomplete="off">


                 <button id="btn-nuevo" type="button" class="btn">Nuevo alumno</button>
            </label>
        </div>
    </section>



 <section class="formulario-alumno" id="panel-registro" hidden>
    <h3>Registrar alumnos</h3>
  
       <form>
          <input type="text" placeholder="nombre completo" required>

            <input type="text" placeholder="Area" required>
        
            <input type="number" placeholder="ciclo"
            min="0" max="10" step="1" required>
        
           <button type="submit">Registrar alumno</button>  
              
   
 </section> 
 
 
     


<!-- tabla de alumnos -->
<section>
        <thead>
            <tr>
                <th>Codigo</th>
                <th>Nombre</th>
                <th>Area</th>
                <th>Ciclo</th>
                <th>Acciones</th>
            </tr>
        </thead>

</section>


</body>
</html>
